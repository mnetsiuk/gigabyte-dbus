[package]
name = "gigabyted"
version = "1.1.0"
edition = "2021"
rust-version = "1.87" # u32::is_multiple_of

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "testd"
path = "src/testing.rs"

[dependencies]
zbus = "3.12.0"
udev = "^0.7.0"
libc = "0.2.191"

[dependencies.async-std]
version = "1.13.2"
features = ["attributes"]

[lints.clippy]
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
